egador para recordar tu carrito cuando vuelvas. No usamos cookies de publicidad ni de análisis. Si lo rechazas, la web funciona igual, pero el carrito se borra al cerrarla. <a href="#" data-legal="cookies">Política de cookies</a>',ckReject:"Rechazar",ckAccept:"Aceptar",docs:{aviso:`<h3>Titular</h3>
<p>Esta web es de Almantec M\xf3viles, tienda de telefon\xeda en Almansa (Albacete).</p>
<p>Contacto: ${X} (ventas, WhatsApp) y ${Y} (reparaciones, WhatsApp y llamadas).</p>
<h3>Para qu\xe9 sirve esta web</h3>
<p>Muestra los m\xf3viles de la tienda y sus precios a t\xedtulo informativo. En ella no se vende ni se paga nada: el carrito solo prepara un mensaje de WhatsApp para pedir informaci\xf3n a la tienda.</p>
<p>Los precios son los de los carteles de oferta de octubre de 2026, salvo error tipogr\xe1fico. Las im\xe1genes son ilustrativas y el color y el aspecto reales pueden variar ligeramente.</p>
<h3>Propiedad intelectual y marcas</h3>
<p>Los textos, el dise\xf1o y las im\xe1genes de esta web son de Almantec M\xf3viles o se usan con permiso. No se pueden copiar ni reutilizar sin autorizaci\xf3n.</p>
<p>Apple e iPhone son marcas de Apple Inc.; Samsung y Galaxy, de Samsung Electronics; Xiaomi y Redmi, de Xiaomi. Se citan solo para identificar los productos y Almantec M\xf3viles no est\xe1 afiliada a ellos.</p>
<p>Tipograf\xedas Archivo, Instrument Sans e IBM Plex Sans Arabic, con licencia SIL Open Font License 1.1.</p>`,privacidad:`<h3>Qu\xe9 datos recogemos en esta web</h3>
<p>Ninguno. Esta web no tiene servidor de formularios ni base de datos. Lo que escribes en el apartado de reparaciones (problema, modelo y tel\xe9fono), en el de segunda mano y reacondicionados (el m\xf3vil que buscas y tu presupuesto) y la lista del carrito solo se usan para preparar un mensaje de WhatsApp, y eres t\xfa quien decide enviarlo.</p>
<h3>Cuando nos escribes por WhatsApp</h3>
<p>Si env\xedas el mensaje, Almantec M\xf3viles recibe tu n\xfamero y lo que hayas escrito, y lo usa solo para contestarte sobre tu consulta, tu pedido o tu reparaci\xf3n.</p>
<p>WhatsApp es un servicio de WhatsApp (Meta) y se rige por su propia pol\xedtica de privacidad.</p>
<h3>Descuento del 5 % en accesorios</h3>
<p>Si quieres el descuento, puedes darnos tu correo o tu tel\xe9fono. Igual que en el resto de la web, no se guardan aqu\xed: se prepara un mensaje de WhatsApp al ${Y} y eres t\xfa quien decide enviarlo. Si lo env\xedas, usaremos esos datos solo para aplicarte el descuento en tu primera compra de accesorios y avisarte de \xe9l, y los borraremos cuando lo uses o cuando nos lo pidas. Darlos es voluntario: la base es tu consentimiento, que puedes retirar cuando quieras.</p>
<h3>Tus derechos</h3>
<p>Puedes pedirnos ver, corregir o borrar tus datos escribiendo a cualquiera de los dos n\xfameros de la tienda. Tambi\xe9n puedes reclamar ante la Agencia Espa\xf1ola de Protecci\xf3n de Datos (aepd.es).</p>`,cookies:`<h3>Qu\xe9 guardamos en tu navegador</h3>
<p>Esta web no instala cookies. Usa el almacenamiento local de tu navegador, una tecnolog\xeda parecida, para cuatro cosas:</p>
<ul>
<li><code>almantec-cookies</code>: recuerda si aceptaste o rechazaste este aviso, para no volver a mostr\xe1rtelo. Es necesaria.</li>
<li><code>almantec-idioma</code>: recuerda el idioma que elegiste. Solo se guarda si cambias el idioma.</li>
<li><code>almantec-carrito</code>: los m\xf3viles de tu carrito, para que sigan ah\xed cuando vuelvas. Solo se guarda si aceptas.</li>
<li><code>almantec-oferta</code>: recuerda si ya pediste o rechazaste el descuento del 5 %, para no volver a ofrec\xe9rtelo. Solo se guarda si aceptas.</li>
</ul>
<p>No usamos cookies de an\xe1lisis, de publicidad ni de redes sociales.</p>
<h3>Servicios de terceros</h3>
<p>Las tipograf\xedas se descargan de Google Fonts; al descargarlas, Google recibe la direcci\xf3n IP de tu navegador. Los botones de WhatsApp te llevan a WhatsApp, que tiene su propia pol\xedtica de cookies.</p>
<h3>Cambiar tu elecci\xf3n</h3>
<p>Puedes cambiarla cuando quieras con \xabConfigurar cookies\xbb, al final de la p\xe1gina, o borrando los datos de este sitio en tu navegador.</p>`}},en:{name:"English",locale:"en-GB",title:"Almantec Catalogue",navAria:"Sections",navPhones:"Phones",navRepairs:"Repairs",navAcc:"Accessories",cart:"Cart",lang:"Language",h1:"New, sealed phones ready to take home",pr1:"New and sealed",pr2:"Free gift: case, screen protector and charger",pr3:"1-year warranty",pr4:"Repairs in under 1 hour",brand:"Brand",all:"All",sort:"Sort",asc:"Price: low to high",desc:"Price: high to low",empty:"No phones from this brand right now.",color:"Colour",colors:"Colours",capacity:"Storage",ask:"Price on request",add:"Add to cart",added:"Added",alt:"{p} in {c}",specs:{Cámara:"Camera",Pantalla:"Display",Chip:"Chip"},values:{"Cámara Pro 48 MP":"48 MP Pro camera"},colorNames:{Granate:"Burgundy","Azul claro":"Light blue",Negro:"Black",Naranja:"Orange",Blanco:"White",Verde:"Green",Morado:"Purple",Azul:"Blue",Rosa:"Pink",Gris:"Grey","Azul cielo":"Sky blue","Verde roble":"Oak green","Azul oscuro":"Dark blue",Violeta:"Violet"},toastAdded:"Added to cart:",waAsk:"Ask for information on WhatsApp",viewCart:"View cart",cartTitle:"Your cart",close:"Close",cartEmpty:"Your cart is empty. Add the phones you are interested in and ask for information on WhatsApp.",total:"Total",plusAsk:" + on request",cartNote:`WhatsApp opens with your list, ready to send to ${X}.`,clear:"Empty cart",remove:"Remove",less:"One less",more:"One more",askShort:"On request",cartAria:e=>`Cart, ${e} ${1===e?"phone":"phones"}`,waCart:"Hello Almantec, I would like information about these products:",waPriceAsk:"price on request",waUnknown:" (not counting items with price on request)",condLbl:"Condition",condNew:"New and sealed",condUsed:"Second-hand",condUsedFull:"Second-hand (all original)",condRefurb:"Refurbished",navUsed:"Second-hand",usedEyebrow:"Second-hand and refurbished",usedTitle:"Second-hand and refurbished phones",usedIntro:"Be nks",offText:"Would you like to leave us your email or phone number? You get 5% off your first accessories purchase. It is optional: you can say no.",offErr:"Enter a valid email or phone number.",waEmail:"Email",offNote:`WhatsApp opens so you can send it to ${Y}. We will only use it for your discount. <a href="#" data-legal="privacidad">Privacy</a>`,waOffer:"Hello Almantec, I would like the 5% discount on my first accessories purchase.",waDiscount:"I have asked for the 5% discount on my first accessories purchase.",repEyebrow:"Repair service",repTitle:"Repairs in under 1 hour",repIntro:"Tell us what is wrong with your phone and ask us directly on WhatsApp or by phone.",repDirect:"Repairs",repQ:"What is wrong with your phone?",repChoose:"Choose an option",problems:["Broken screen or no display","Battery drains fast or is swollen","Won’t charge","Won’t turn on","Got wet","Camera","I can’t hear or people can’t hear me (speaker or microphone)","Buttons","Broken back cover","Slow, freezes or restarts","Other problem"],repModel:"Brand and model",repModelPh:"E.g. iPhone 13, Galaxy A54",repPhone:"Your phone number",repMore:"Tell us more",optional:"(optional)",repMorePh:"Since when, whether it was dropped…",repWa:"Ask on WhatsApp",call:"Call",errMissing:"Missing: {list}.",listSep:", ",errProblem:"what is wrong",errModel:"brand and model",errPhone:"a valid phone number",waRep:"Hello Almantec, I would like to ask about a repair.",waDevice:"Phone",waProblem:"Problem",waDetail:"Details",waMyPhone:"My number",fContact:`Almansa \xb7 Sales: <a href="https://wa.me/34644119250" target="_blank" rel="noopener">${X}</a> \xb7 Repairs: <a href="tel:+34622097110">${Y}</a>`,legalAria:"Legal information",fAviso:"Legal notice",fPriv:"Privacy policy",fCookies:"Cookie policy",fSettings:"Cookie settings",fPrices:"Prices from Almantec’s offer posters, October 2026, barring typographical errors. The cart is only for asking for information on WhatsApp; nothing is sold or paid for on this website.", <p>This website belongs to Almantec M\xf3viles, a phone shop in Almansa (Albacete, Spain).</p>
<p>Contact: ${X} (sales, WhatsApp) and ${Y} (repairs, WhatsApp and calls).</p>
<h3>What this website is for</h3>
<p>It shows the shop’s phones and prices for information only. Nothing is sold or paid for on it: the cart only prepares a WhatsApp message to ask the shop for information.</p>
<p>Prices are those on the October 2026 offer posters, barring typographical errors. Images are illustrative and the actual colour and appearance may vary slightly.</p>
<h3>Intellectual property and trademarks</h3>
<p>The texts, design and images on this website belong to Almantec M\xf3viles or are used with permission. They may not be copied or reused without authorisation.</p>
<p>Apple and iPhone are trademarks of Apple Inc.; Samsung and Galaxy, of Samsung Electronics; Xiaomi and Redmi, of Xiaomi. They are mentioned only to identify the products, and Almantec M\xf3viles is not affiliated with them.</p>
<p>Archivo, Instrument Sans and IBM Plex Sans Arabic typefaces, under the SIL Open Font License 1.1.</p>
<p>If in doubt, the Spanish version of these texts prevails.</p>`,privacidad:`<h3>What data we collect on this website</h3>
<p>None. This website has no form server or database. What you type in the repairs section (problem, model and phone number), in the second-hand and refurbished section (the phone you are looking for and your budget) and your cart list are only used to prepare a WhatsApp message, and you decide whether to send it.</p>
<h3>When you write to us on WhatsApp</h3>
<p>If you send the message, Almantec M\xf3viles receives your number and what you wrote, and uses it only to reply about your enquiry, order or repair.</p>
<p>WhatsApp is a service of WhatsApp (Meta) and is governed by its own privacy policy.</p>
<h3>5% discount on accessories</h3>
<p>If you want the discount, you can give us your email or phone number. As elsewhere on this website, they are not stored here: a WhatsApp message to ${Y} is prepared and you decide whether to send it. If you send it, we will use that data only to apply the discount to your first accessories purchase and to tell you about it, and we will delete it once you have used it or when you ask us to. Giving it is voluntary: the legal basis is your consent, which you can withdraw at any time.</p>
<h3>Your rights</h3>
<p>You can ask us to see, correct or delete your data by writing to either of the shop’s numbers. You can also complain to the Spanish Data Protection Agency (aepd.es).</p>
<p>If in doubt, the Spanish version of these texts prevails.</p>`,cookies:`<h3>What we store in your browser</h3>
<p>This website does not set cookies. It uses your browser’s local storage, a similar technology, for four things:</p>
<ul>
<li><code>almantec-cookies</code>: remembers whether you accepted or rejected this notice, so it is not shown again. Necessary.</li>
<li><code>almantec-idioma</code>: remembers the language you chose. Saved only if you change the language.</li>
<li><code>almantec-carrito</code>: the phones in your cart, so they are still there when you come back. Saved only if you accept.</li>
<li><code>almantec-oferta</code>: remembers whether you already asked for or declined the 5% discount, so we do not offer it again. Saved only if you accept.</li>
</ul>
<p>We do not use analytics, advertising or social media cookies.</p>
<h3>Third-party services</h3>
<p>Fonts are downloaded from Google Fonts; when they are downloaded, Google receives your browser’s IP address. The WhatsApp buttons take you to WhatsApp, which has its own cookie policy.</p>
<h3>Changing your choice</h3>
<p>You can change it at any time with “Cookie settings” at the bottom of the page, or by clearing this site’s data in your browser.</p>

<p>Questo sito appartiene ad Almantec M\xf3viles, negozio di telefonia ad Almansa (Albacete, Spagna).</p>
<p>Contatti: ${X} (vendite, WhatsApp) e ${Y} (riparazioni, WhatsApp e chiamate).</p>

<p>Mostra gli smartphone del negozio e i loro prezzi a titolo informativo. Qui non si vende n\xe9 si paga nulla: il carrello prepara solo un messaggio WhatsApp per chiedere informazioni al negozio.</p>
<p>I prezzi sono quelli dei volantini promozionali di ottobre 2026, salvo errori tipografici. Le immagini sono illustrative; il colore e l’aspetto reali possono variare leggermente.</p>
<h3>Propriet\xe0 intellettuale e marchi</h3>

<p>Apple e iPhone sono marchi di Apple Inc.; Samsung e Galaxy, di Samsung Electronics; Xiaomi e Redmi, di Xiaomi. Sono citati solo per identificare i prodotti e Almantec M\xf3viles non \xe8 affiliata a essi.</p>
<p>Caratteri Archivo, Instrument Sans e IBM Plex Sans Arabic, con licenza SIL Open Font License 1.1.</p>
<p>In caso di dubbio prevale la versione spagnola di questi testi.</p>`,privacidad:`<h3>Quali dati raccogliamo su questo sito</h3>
<p>Nessuno. Questo sito non ha un server per i moduli n\xe9 un database. Ci\xf2 che scrivi nella sezione riparazioni (problema, modello e telefono), nella sezione usato e ricondizionati (lo smartphone che cerchi e il tuo budget) e la lista del carrello servono solo a preparare un messaggio WhatsApp, e sei tu a decidere se inviarlo.</p>
<h3>Quando ci scrivi su WhatsApp</h3>
<p>Se invii il messaggio, Almantec M\xf3viles riceve il tuo numero e ci\xf2 che hai scritto, e lo usa solo per risponderti sulla tua richiesta, il tuo ordine o la tua riparazione.</p>
<p>WhatsApp \xe8 un servizio di WhatsApp (Meta) ed \xe8 regolato dalla propria informativa sulla privacy.</p>
<h3>Sconto del 5% sugli accessori</h3>
<p>Se vuoi lo sconto, puoi darci la tua email o il tuo telefono. Come nel resto del sito, non vengono salvati qui: si prepara un messaggio WhatsApp al ${Y} e sei tu a decidere se inviarlo. Se lo invii, useremo questi dati solo per applicarti lo sconto sul primo acquisto di accessori e avvisarti, e li cancelleremo quando lo avrai usato o quando ce lo chiederai. Fornirli \xe8 facoltativo: la base giuridica \xe8 il tuo consenso, che puoi revocare in qualsiasi momento.</p>
<h3>I tuoi diritti</h3>
<p>Puoi chiederci di vedere, correggere o cancellare i tuoi dati scrivendo a uno dei due numeri del negozio. Puoi anche presentare reclamo all’Agenzia spagnola per la protezione dei dati (aepd.es).</p>
<p>In caso di dubbio prevale la versione spagnola di questi testi.</p>`,cookies:`<h3>Cosa salviamo nel tuo browser</h3>
